<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | CampusBus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #driverMap { height: 50vh; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-100">

    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-green-600 w-12 h-12 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bus text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">CampusBus Driver</h1>
                    <p id="driverName" class="text-sm text-slate-500">Welcome Driver</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button id="logoutBtn" class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-semibold transition">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Current Status -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <p class="text-slate-500 font-semibold text-sm">BUS NUMBER</p>
                <p id="busNumber" class="text-3xl font-bold text-slate-800">BUS-001</p>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <p class="text-slate-500 font-semibold text-sm">CURRENT STOP</p>
                <p id="currentStop" class="text-3xl font-bold text-indigo-600">-</p>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <p class="text-slate-500 font-semibold text-sm">STATUS</p>
                <p id="driverStatus" class="text-3xl font-bold text-green-600">On Route</p>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <p class="text-slate-500 font-semibold text-sm">LAST UPDATE</p>
                <p id="lastUpdate" class="text-lg font-bold text-slate-800">-</p>
            </div>
        </div>

        <!-- Route Information -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">
                <i class="fas fa-route mr-2 text-blue-600"></i>Today's Route
            </h2>
            <div class="bg-slate-50 rounded-lg p-4 mb-4">
                <p class="text-slate-600"><strong>Route:</strong> Main Campus → North Gate → East Wing → South Campus</p>
                <p class="text-slate-600"><strong>Total Stops:</strong> 4</p>
            </div>

            <h3 class="font-bold text-slate-800 mb-3">Update Location for Next Stop:</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Next Stop</label>
                    <select id="nextStop" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">-- Select Stop --</option>
                        <option value="Main Campus">Main Campus</option>
                        <option value="North Gate">North Gate</option>
                        <option value="East Wing">East Wing</option>
                        <option value="South Campus">South Campus</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Stop Number</label>
                    <select id="stopNumber" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="1">Stop 1 of 4</option>
                        <option value="2">Stop 2 of 4</option>
                        <option value="3">Stop 3 of 4</option>
                        <option value="4">Stop 4 of 4</option>
                    </select>
                </div>
                <button id="updateLocationBtn" class="w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-map-pin"></i>Update Location & Move to Next Stop
                </button>
            </div>
        </div>

        <!-- Current Location Map -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h3 class="text-xl font-bold text-slate-800 mb-4">
                <i class="fas fa-map mr-2 text-indigo-600"></i>Current Location
            </h3>
            <div id="driverMap" class="mb-4"></div>
            <div class="text-center">
                <button id="shareLocationBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition">
                    <i class="fas fa-share-alt mr-2"></i>Share Current Location
                </button>
            </div>
        </div>

        <!-- History -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-bold text-slate-800 mb-4">
                <i class="fas fa-history mr-2 text-slate-600"></i>Location Update History
            </h3>
            <div id="historyList" class="space-y-3">
                <p class="text-slate-500 text-center py-4">No location updates yet</p>
            </div>
        </div>
    </div>

    <button id="emergencyPanicBtn" onclick="triggerPanic()" class="fixed bottom-10 right-10 w-24 h-24 bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center border-8 border-white z-50 transition-transform active:scale-90 hover:bg-rose-700">
        <i class="fas fa-skull text-2xl mb-1"></i>
        <span class="text-[10px] font-black uppercase">Panic</span>
    </button>

    <script src="js/panic.js"></script>
    <script>
        const apiBase = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '') ? 'http://localhost:3000/api' : '/api';
        let driverMap = null;
        let driverMarker = null;
        let currentLocation = null;

        document.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole');
            const userName = localStorage.getItem('userName');
            const userEmail = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');

            if (userRole !== 'driver' || !userEmail || !userId) {
                alert('Unauthorized access! Please login as driver.');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('driverName').textContent = `Welcome ${userName}!`;

            initializeMap();
            loadLocationHistory(userId);

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('userRole');
                localStorage.removeItem('userName');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
            });

            document.getElementById('updateLocationBtn').addEventListener('click', () => updateLocation(userId));
            document.getElementById('shareLocationBtn').addEventListener('click', () => shareCurrentLocation(userId));
            getDriverLocation();
        });

        function initializeMap() {
            driverMap = L.map('driverMap').setView([28.5355, 77.3910], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(driverMap);

            driverMarker = L.marker([28.5355, 77.3910], {
                title: 'Current Location'
            }).addTo(driverMap)
                .bindPopup('<strong>Driver Location</strong>')
                .openPopup();
        }

        function getDriverLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by this browser.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    driverMap.setView([currentLocation.lat, currentLocation.lng], 15);
                    driverMarker.setLatLng([currentLocation.lat, currentLocation.lng]);
                    driverMarker.bindPopup(`<strong>Driver at</strong><br>Lat: ${currentLocation.lat.toFixed(4)}<br>Lng: ${currentLocation.lng.toFixed(4)}`).openPopup();
                },
                (error) => {
                    console.error('Geolocation error:', error);
                    alert('Unable to get location. Please enable location services.');
                }
            );
        }

        async function updateLocation(userId) {
            const nextStop = document.getElementById('nextStop').value;
            const stopNumber = document.getElementById('stopNumber').value;

            if (!nextStop) {
                alert('Please select a stop.');
                return;
            }

            if (!currentLocation) {
                alert('Unable to get location. Please try again.');
                getDriverLocation();
                return;
            }

            const payload = {
                userId: Number(userId),
                driverName: localStorage.getItem('userName'),
                busNumber: document.getElementById('busNumber').textContent,
                stop: nextStop,
                stopNumber,
                latitude: currentLocation.lat,
                longitude: currentLocation.lng,
                locationText: `Lat: ${currentLocation.lat.toFixed(4)}, Lng: ${currentLocation.lng.toFixed(4)}`
            };

            try {
                const response = await fetch(`${apiBase}/location-updates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    console.error('[DRIVER] Location update failed:', response.status);
                    const result = await response.json();
                    throw new Error(result.message || 'Unable to save location update.');
                }
                
                const result = await response.json();

                document.getElementById('currentStop').textContent = nextStop;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
                document.getElementById('nextStop').value = '';
                loadLocationHistory(userId);
                alert('✅ Location updated successfully.');
            } catch (error) {
                console.error('[DRIVER ERROR]', error.message);
                alert('❌ ' + error.message);
            }
        }

        async function shareCurrentLocation(userId) {
            if (!currentLocation) {
                alert('Unable to get location. Please try again.');
                getDriverLocation();
                return;
            }

            const payload = {
                userId: Number(userId),
                driverName: localStorage.getItem('userName'),
                busNumber: document.getElementById('busNumber').textContent,
                stop: 'Current Location',
                stopNumber: null,
                latitude: currentLocation.lat,
                longitude: currentLocation.lng,
                locationText: `Lat: ${currentLocation.lat.toFixed(4)}, Lng: ${currentLocation.lng.toFixed(4)}`
            };

            try {
                const response = await fetch(`${apiBase}/location-updates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    console.error('[DRIVER] Share location failed:', response.status);
                    const result = await response.json();
                    throw new Error(result.message || 'Unable to share location.');
                }
                
                const result = await response.json();

                loadLocationHistory(userId);
                alert('✅ Current location shared successfully.');
            } catch (error) {
                console.error('[DRIVER ERROR]', error.message);
                alert('❌ ' + error.message);
            }
        }

        async function loadLocationHistory(userId) {
            try {
                const response = await fetch(`${apiBase}/location-updates?userId=${encodeURIComponent(userId)}`);
                
                if (!response.ok) {
                    console.error('[DRIVER] History fetch failed:', response.status);
                    throw new Error('Unable to load history.');
                }
                
                const history = await response.json();
                const historyList = document.getElementById('historyList');

                if (!history.length) {
                    historyList.innerHTML = '<p class="text-slate-500 text-center py-4">No location updates yet</p>';
                    return;
                }

                historyList.innerHTML = history.map(update => `
                    <div class="border border-slate-200 rounded-lg p-4 hover:shadow-md transition bg-slate-50">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-bold text-slate-800"><i class="fas fa-map-pin mr-2 text-blue-600"></i>${update.stop} <span class="text-slate-500">${update.stopNumber ? `(Stop ${update.stopNumber})` : ''}</span></p>
                                <p class="text-sm text-slate-600 mt-1"><i class="fas fa-clock mr-2"></i>${update.timestamp}</p>
                                <p class="text-sm text-slate-600"><i class="fas fa-map-pin mr-2"></i>${update.locationText}</p>
                            </div>
                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">Completed</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                document.getElementById('historyList').innerHTML = '<p class="text-slate-500 text-center py-4">Unable to load history.</p>';
            }
        }
    </script>

</body>
</html>
