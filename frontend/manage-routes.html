<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Routes - College Bus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <div class="flex h-screen">
        <aside class="w-64 bg-indigo-900 text-white p-6 hidden md:block">
            <h2 class="text-2xl font-bold mb-8">CampusBus</h2>
            <nav class="space-y-4">
                <a href="admin-dashboard.html" class="block p-3 hover:bg-indigo-800 rounded-lg"><i class="fas fa-home mr-2"></i> Dashboard</a>
                <a href="tracking.html" class="block p-3 hover:bg-indigo-800 rounded-lg"><i class="fas fa-map-marker-alt mr-2"></i> Live Tracking</a>
                <a href="manage-routes.html" class="block p-3 bg-indigo-800 rounded-lg"><i class="fas fa-route mr-2"></i> Manage Routes</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Route Configuration</h1>
                <p class="text-gray-500">Assign buses, stops, and timing schedules.</p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-200 h-fit">
                    <h3 class="text-lg font-bold mb-4 flex items-center">
                        <i class="fas fa-plus-circle text-indigo-600 mr-2"></i> Create New Route
                    </h3>
                    <form id="routeForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Route Name</label>
                            <input id="routeName" type="text" placeholder="e.g. North Campus Express" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Bus Number</label>
                            <input id="busNumber" type="text" placeholder="e.g. TN-01-AB-1234" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Driver Name</label>
                            <input id="driverName" type="text" placeholder="Enter driver name" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
                            Save Route
                        </button>
                    </form>
                </div>

                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="text-lg font-bold">Existing Routes</h3>
                        <input type="text" placeholder="Search routes..." class="text-sm p-2 border rounded-md outline-none">
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-sm">
                            <tr>
                                <th class="p-4 font-semibold">Route/Bus</th>
                                <th class="p-4 font-semibold">Stops</th>
                                <th class="p-4 font-semibold">Status</th>
                                <th class="p-4 font-semibold">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr>
                                <td class="p-4">
                                    <div class="font-bold">Route A</div>
                                    <div class="text-xs text-gray-400">Bus: TS-09-2024</div>
                                </td>
                                <td class="p-4 text-sm">Downtown, West-Gate, Main Library</td>
                                <td class="p-4">
                                    <span class="bg-green-100 text-green-700 px-2 py-1 rounded-md text-xs font-bold">Active</span>
                                </td>
                                <td class="p-4">
                                    <button class="text-indigo-600 hover:text-indigo-900 mr-3"><i class="fas fa-edit"></i></button>
                                    <button class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                            </tbody>
                    </table>
                </div>
            </div>

            <button onclick="triggerPanic()" class="fixed bottom-8 right-8 w-16 h-16 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center z-50">
                <i class="fas fa-exclamation-triangle"></i>
            </button>
        </main>
    </div>

    <script src="js/routes.js"></script>
    <script src="js/panic.js"></script>
