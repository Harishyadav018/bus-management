<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking | CampusBus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> #map { height: 60vh; width: 100%; border-radius: 2rem; } </style>
</head>
<body class="bg-slate-50">
    <div class="p-6 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">Bus Tracking</h1>
            <a href="index.html" class="text-indigo-600 font-bold"><i class="fas fa-arrow-left mr-2"></i>Back</a>
        </div>
        
        <div id="map" class="shadow-xl border-8 border-white"></div>

        <div class="mt-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
                <p class="text-slate-400 font-bold text-xs uppercase">Estimated Arrival</p>
                <h3 class="text-xl font-black text-slate-800">12 Minutes (North Gate)</h3>
            </div>
            <div class="text-right">
                <span class="bg-green-100 text-green-700 px-4 py-1 rounded-full text-xs font-black uppercase">On Time</span>
            </div>
        </div>
    </div>

    <button id="emergencyPanicBtn" onclick="triggerPanic()" class="fixed bottom-10 right-10 w-24 h-24 bg-rose-600 text-white rounded-full shadow-2xl flex flex-col items-center justify-center border-8 border-white z-50 transition-transform active:scale-90">
        <i class="fas fa-skull text-2xl mb-1"></i>
        <span class="text-[10px] font-black uppercase">Panic</span>
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/panic.js"></script>
</body>
</html>
